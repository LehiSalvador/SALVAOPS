name: Validar documentación
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  documentation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Preparar Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Obtener checker fijado
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: LehiSalvador/SalvaSystems
          ref: a5700d27b5f170a9d71d9098e2ada3e615355248
          path: .docs-tools
          sparse-checkout: tools/check_docs.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Validar documentos locales
        run: python .docs-tools/tools/check_docs.py --root .
